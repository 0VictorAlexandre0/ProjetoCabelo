{% extends "base.html" %}

{% block titulo %}
Clientes
{% endblock %}

{% block conteudo %}

<h2>Clientes</h2>

<a href="#">Novo Cliente</a>

<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
        </tr>
    </thead>

    <tbody>

        {% for cliente in clientes %}

        <tr>
            <td>{{ cliente.id }}</td>
            <td>{{ cliente.nome }}</td>
            <td>{{ cliente.telefone }}</td>
            <td>{{ cliente.email }}</td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
