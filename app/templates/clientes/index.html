{% extends "base.html" %}

{% block titulo %}
Clientes
{% endblock %}

{% block conteudo %}

<h2>Clientes</h2>

<form method="GET" action="{{ url_for('clientes.listar_clientes')}}">

    <label for="busca">Pesquisar cliente por nome</label>

    <input type="text" id="busca" name="busca" value="{{busca}}" placeholder="Digite o nome do cliente">

    <button type="submit">Pesquisar</button>

    <a href="{{url_for('clientes.listar_clientes')}}">Limpar pesquisa</a>
    
</form>

<a href="{{ url_for('clientes.novo_cliente') }}">Novo Cliente</a>

<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
        </tr>
    </thead>

    <tbody>

        {% for cliente in clientes %}

        <tr>
            <td>{{ cliente.id }}</td>
            <td>{{ cliente.nome }}</td>
            <td>{{ cliente.telefone }}</td>
            <td>{{ cliente.email }}</td>

            <td>
                <a href="{{ url_for('clientes.editar_cliente', id=cliente.id) }}">Editar</a>
                
                <form method="POST"
                    action="{{ url_for('clientes.excluir_cliente', id=cliente.id) }}"
                    onsubmit="return confirm('Tem certeza de que deseja excluir este cliente?');" 
                    style="display: inline;">

                    <button type="submit">Excluir</button>
                </form>
            
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
