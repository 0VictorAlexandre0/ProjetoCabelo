{% extends "base.html" %}

{% block titulo %} Novo Cliente {% endblock %}

{% block conteudo %}
<h2>Cadastrar Clientes</h2>

<form method="POST" action="{{ url_for('clientes.novo_cliente') }}">

    <div>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" maxlength="100" required>
    </div>

    <div>
        <label for="telefone">Telefone:</label>
        <input type="text" name="telefone" id="telefone" maxlength="20" required>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" maxlength="100">
    </div>

    <button type="submit">Salvar Cliente</button>
    <a href="{{ url_for('clientes.listar_clientes') }}">Cancelar</a>


</form>
{% endblock %}
