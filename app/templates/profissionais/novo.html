{% extends "base.html" %}

{% block titulo %}
Novo Profissional
{% endblock %}

{% block conteudo %}

<h2>Novo Profissional</h2>

<form method="POST" action="{{url_for('profissionais.novo_profissional')}}">
    <div>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" maxlength="100" value="{{request.form.get('nome', '')}}" required>
    </div>

    <div>
        <label for="especialidade">Especialidade</label>
        <input type="text" name="especialidade" id="especialidade" maxlength="100" value="{{request.form.get('especialidade', '')}}" required>
    </div>

    <div>
        <label for="telefone">Telefone</label>
        <input type="text" name="telefone" id="telefone" maxlength="20" value="{{request.form.get('telefone', '')}}" required>
    </div>

    <div>
        <label>Serviços que realiza:</label>

        {% for servico in servicos %}

        <div>
            <input 
                type="checkbox"
                name="servicos" 
                id="servico_{{servico.id}}" 
                value="{{servico.id}}" 
                {% if servico.id|string in request.form.getlist('servicos') %}checked{% endif %}
            >
            <label for="servico_{{servico.id}}">{{servico.nome}}</label>
        </div>
        {% endfor %}
    </div>

    {% if erro %}
        <p class="text-danger">{{ erro }}</p>
    {% endif %}

    <button type="submit">Cadastrar</button>

    <a href="{{url_for('profissionais.listar_profissionais')}}">Cancelar</a>
</form>

{% endblock %}
