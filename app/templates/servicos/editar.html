{% extends "base.html" %}

{% block titulo %}
Editar Serviço
{% endblock %}

{% block conteudo %}

<h2>Editar Serviço</h2>

<form method="POST" action="{{ url_for('servicos.editar_servico', id=servico.id) }}">
    <div>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" maxlength="100" value="{{servico.nome}}" required>
    </div>

    <div>
        <label for="duracao">Duração (minutos):</label>
        <input type="number" name="duracao" id="duracao" min="1" step="1" value="{{ servico.duracao }}" required>
    </div>

    <div>
        <label for="preco">Preço (R$):</label>
        <input type="number"name="preco" id="preco" min="0" step="0.01" value="{{ servico.preco }}" required>
    </div>

    <button type="submit">Salvar Alterações</button>

    <a href="{{ url_for('servicos.listar_servicos') }}">Cancelar</a>
</form>

{% endblock %}
