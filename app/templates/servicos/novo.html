{% extends "base.html" %}

{% block titulo %}
Novo Serviço
{% endblock %}

{% block conteudo %}

<h2>Novo Serviço</h2>

<form method="POST" action="{{url_for('servicos.novo_servico')}}">
    <div>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" maxlength="100" required>
    </div>

    <div>
        <label for="duracao">Duração (minutos):</label>
        <input type="number" name="duracao" id="duracao" min="1" step="1" required>
    </div>

    <div>
        <label for="preco">Preço (R$):</label>
        <input type="number" name="preco" id="preco" min="0" step="0.01" required>
    </div>

    <button type="submit">Cadastrar</button>

    <a href="{{url_for('servicos.listar_servicos')}}">Cancelar</a>
</form>

{% endblock %}
